name: Capture screenshots

on:
  workflow_call:
    inputs:
      publish:
        description: Open a pull request with updated screenshots
        default: false
        type: boolean
      publish-base:
        description: Branch to update through a pull request
        default: main
        type: string
      publish-branch:
        description: Dedicated branch for screenshot updates
        default: screenshot-updates
        type: string
      source:
        description: repository to build and serve the checkout, or public for a deployed site
        default: repository
        type: string
      config:
        description: JSON configuration path in the caller repository
        required: true
        type: string
      build-command:
        description: Command to install dependencies and build the site
        default: ''
        type: string
      start-command:
        description: Foreground command to serve the site
        default: ''
        type: string
      base-url:
        description: URL used to check readiness and resolve page paths
        required: true
        type: string
      tools-ref:
        description: Course Board ref containing the capture scripts
        default: main
        type: string
      node-version:
        default: '22'
        type: string
      artifact-name:
        default: screenshots
        type: string
      ready-timeout:
        description: Maximum seconds to wait for the server
        default: 60
        type: number

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: site
          fetch-depth: 0
          persist-credentials: ${{ inputs.publish }}
      - uses: actions/checkout@v6
        with:
          repository: lprakashv/course-board
          ref: ${{ inputs.tools-ref }}
          path: capture-tools
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Install capture tools
        working-directory: capture-tools/tools/screenshots
        run: |
          npm ci
          npm test
          npx playwright install --with-deps --only-shell chromium
      - name: Capture screenshots
        working-directory: site
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          START_COMMAND: ${{ inputs.start-command }}
          BASE_URL: ${{ inputs.base-url }}
          CONFIG: ${{ inputs.config }}
          READY_TIMEOUT: ${{ inputs.ready-timeout }}
        run: bash ../capture-tools/tools/screenshots/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
      - name: Propose screenshot updates
        if: inputs.publish && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.publish-base)
        working-directory: site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.publish-base }}
          BRANCH: ${{ inputs.publish-branch }}
          CONFIG: ${{ inputs.config }}
          CAPTURE_COMMIT: ${{ github.sha }}
        run: |
          git check-ref-format --branch "$BASE" > /dev/null
          git check-ref-format --branch "$BRANCH" > /dev/null
          if [ "$BASE" = "$BRANCH" ]; then echo 'The update branch must differ from the base branch.' >&2; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BASE"
          if [ "$(git rev-parse FETCH_HEAD)" != "$CAPTURE_COMMIT" ]; then
            echo 'The base branch moved after capture. Run the workflow again.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" FETCH_HEAD
            git merge --no-edit "$CAPTURE_COMMIT"
          else
            git switch -c "$BRANCH" "$CAPTURE_COMMIT"
          fi
          node ../capture-tools/tools/screenshots/publish.js "$CONFIG" "$PWD" "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/screenshot-files"
          while IFS= read -r -d '' file; do git add -- "$file"; done < "$RUNNER_TEMP/screenshot-files"
          if ! git diff --cached --quiet; then git commit -m 'Update screenshots'; fi
          if git diff --quiet "$CAPTURE_COMMIT" HEAD; then
            echo 'The screenshots are already current.'
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          existing=$(gh pr list --base "$BASE" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title 'Update screenshots' --body 'Update the configured screenshots and Markdown section from the latest site build.'
          fi
