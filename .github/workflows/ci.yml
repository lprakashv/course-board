name: Course Board CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - run: npm pack --dry-run

  screenshots:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/screenshots.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      config: example/screenshots.json
      build-command: npm ci && npm run build
      start-command: npm run run
      base-url: http://127.0.0.1:4174
      tools-ref: ${{ github.sha }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: course-board-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare the release
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable package version. Package: $version." >&2
            exit 1
          fi
          tag="v$version"
          refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          tag_commit=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; found=1 } END { if (!found && NR > 0) print first } NR == 1 { first=$1 }')
          if [[ -n "$tag_commit" && "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "$tag already points to another commit. No release is needed."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release."
            exit 0
          fi
          archive=$(npm pack --silent)
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub Release
        if: steps.package.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" "$PACKAGE_ARCHIVE" --target "$RELEASE_COMMIT" --generate-notes
