name: Course Board CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - run: npm pack --dry-run

  screenshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: readme-screenshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture the example course
        shell: bash
        run: |
          npm run run > /tmp/course-board-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1000 --virtual-time-budget=3000 \
            --screenshot=docs/course-board.png http://127.0.0.1:4174/
      - name: Commit the refreshed screenshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main changed after the screenshot was captured; skipping this refresh.'
            exit 0
          fi
          git add docs/course-board.png
          if git diff --cached --quiet; then
            echo 'The README screenshot is already current.'
            exit 0
          fi
          git commit -m 'Refresh README course screenshot'
          git push origin HEAD:main

  release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pack the tagged version
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "Expected a stable package version with a matching tag. Package: $version. Tag: $RELEASE_TAG." >&2
            exit 1
          fi
          archive=$(npm pack --silent)
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "$RELEASE_TAG" "$PACKAGE_ARCHIVE" --verify-tag --generate-notes
