name: Refresh course showcase

on:
  workflow_run:
    workflows: [Course Board CI and Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-showcase
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        course: [course-board, dsa-blueprint, designed-to-scale]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lprakashv/${{ matrix.course }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture built course
        shell: bash
        run: |
          site=dist
          if [ '${{ matrix.course }}' = 'course-board' ]; then site=example/dist; fi
          python3 -m http.server 4174 --bind 127.0.0.1 --directory "$site" > /tmp/showcase-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,900 --virtual-time-budget=3000 \
            --screenshot="${RUNNER_TEMP}/${{ matrix.course }}.png" http://127.0.0.1:4174/
          test -s "${RUNNER_TEMP}/${{ matrix.course }}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.course }}
          path: ${{ runner.temp }}/${{ matrix.course }}.png
          if-no-files-found: error

  publish:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/showcase
      - name: Publish screenshots to a separate branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin showcase-images > /dev/null; then
            git fetch origin showcase-images
            git switch --detach FETCH_HEAD
          else
            git switch --orphan showcase-images
          fi
          cp "$RUNNER_TEMP/showcase/course-board/course-board.png" .
          cp "$RUNNER_TEMP/showcase/dsa-blueprint/dsa-blueprint.png" .
          cp "$RUNNER_TEMP/showcase/designed-to-scale/designed-to-scale.png" .
          git add course-board.png dsa-blueprint.png designed-to-scale.png
          if git diff --cached --quiet; then
            echo 'The showcase screenshots are already current.'
            exit 0
          fi
          git commit -m 'Refresh course showcase screenshots'
          git push origin HEAD:refs/heads/showcase-images
